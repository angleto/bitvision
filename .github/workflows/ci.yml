name: CI

# Triggers: a push to the dev branch (``v3.10``) runs the lint + test +
# frontend-build gates so the CI badge reflects dev-branch health;
# annotated tags (``v3.x.y``) additionally run the ``docker-images``
# job to build + push the release images; pull requests get the
# lint + test gate before merge. Image builds stay tag-only via the
# ``if:`` guard on ``docker-images`` so WIP branch pushes don't burn
# ARM runner minutes building images.
on:
  push:
    branches: [v3.10]
    tags: ["v*"]
  pull_request:
    branches: [v3.10]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: backend
        run: |
          uv sync --extra dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python ../scripts/lint_phi_safe.py
          uv run pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  docker-images:
    name: Build + push images
    # Native ARM64 runner. The reference production cluster is ARM64,
    # so the images are arm64-only; building natively
    # removes the QEMU x86→arm64 emulation step (5–10x slower than
    # native). Falls back to ``ubuntu-latest`` (amd64) only if a
    # multi-arch fan-out is ever needed — would have to re-add
    # ``docker/setup-qemu-action`` in that case.
    runs-on: ubuntu-24.04-arm
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      # Don't cancel sibling builds on first failure: the four images
      # are independent (a registry-side permissions glitch on one of
      # them, or a Dockerfile change isolated to one service, must
      # not block the others from publishing). The deploy is then
      # done image-by-image so partial success is still useful.
      fail-fast: false
      matrix:
        service: [backend, workers, frontend, mcp-http]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Capture a stable RFC 3339 build timestamp once, so all four
      # service images of the same release line carry the same value.
      - id: buildmeta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Strip a leading "v" from the ref name so semver consumers
          # (image tag, /api/version) see "3.7.1" not "v3.7.1".
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/dockerfiles/${{ matrix.service }}.Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity baked into the image; surfaced by GET
          # /api/version and the /settings build-info card.
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
