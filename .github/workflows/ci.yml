name: CI

# Triggers: a push to the dev branch (``v4.0``) or a ``feat/**`` working
# branch runs the lint + test + frontend-build + search-eval gates so the
# CI badge reflects branch health; annotated tags (``v*``) additionally
# run the ``docker-images`` job to build + push the release images;
# pull requests to ``v4.0`` get the gate before merge. Image builds stay
# tag-only via the ``if:`` guard on ``docker-images`` so WIP branch pushes
# don't burn ARM runner minutes building images.
on:
  push:
    branches: [v4.0, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [v4.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    env:
      # The synthetic pixel-PHI recall gate (test_pixel_deid_redaction) is
      # OCR-backed and silently skips without the tesseract binary. This flag
      # arms a guard test that FAILS when tesseract is missing, so the gate
      # can never skip unnoticed on CI again.
      BVP_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install tesseract (pixel-PHI recall gate)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - working-directory: backend
        run: |
          uv sync --extra dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python ../scripts/lint_phi_safe.py
          uv run pytest

  backend-db-test:
    name: Backend DB-backed tests
    runs-on: ubuntu-latest
    # ``backend-test`` runs without a database, so its ``pytest`` skips
    # everything guarded by ``skip_if_no_db``. This job stands up a real
    # pgvector DB, applies the full migration chain (``alembic upgrade
    # head`` — which also loads the seeded catalog via 0001) and runs the
    # DB-backed feature tests so a tagged release is gated on them.
    # Mirrors the ``search-eval`` service block.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bvphoenix
          POSTGRES_PASSWORD: bvphoenix
          POSTGRES_DB: bvphoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bvphoenix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BVP_DATABASE_URL: postgresql+asyncpg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
      BVP_DATABASE_URL_SYNC: postgresql+psycopg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Migrate + run DB-backed feature tests
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run alembic upgrade head
          uv run pytest tests/test_clinical_event_documents.py tests/integration/test_catalog_db.py tests/test_hybrid_text_dense.py -q

  search-eval:
    name: Search relevance gate
    runs-on: ubuntu-latest
    # Seeds the golden corpus into a real pgvector DB and asserts
    # recall/nDCG/MRR + cross-patient isolation through the live
    # endpoints. FTS-only: no ``ai`` extra, so no BiomedCLIP download —
    # the lexical-relevance + security invariants are gated cheaply.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bvphoenix
          POSTGRES_PASSWORD: bvphoenix
          POSTGRES_DB: bvphoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bvphoenix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BVP_DATABASE_URL: postgresql+asyncpg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
      BVP_DATABASE_URL_SYNC: postgresql+psycopg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
      BVP_RUN_SEARCH_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Migrate + run relevance gate
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run alembic upgrade head
          uv run pytest tests/eval tests/test_search.py -q

  search-eval-ai:
    name: Search relevance gate (ai / semantic)
    runs-on: ubuntu-latest
    # Tag-only + heavy: installs the ``ai`` extra (torch + sentence-
    # transformers, ~600 MB) and downloads the multilingual MiniLM + the
    # cross-encoder to validate the DENSE retrieval path end-to-end with
    # the real model. Deliberately NOT a ``needs`` of docker-images — a
    # HuggingFace download hiccup must never block a release; the fast,
    # model-free ``search-eval`` gate is the blocking one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bvphoenix
          POSTGRES_PASSWORD: bvphoenix
          POSTGRES_DB: bvphoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bvphoenix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BVP_DATABASE_URL: postgresql+asyncpg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
      BVP_DATABASE_URL_SYNC: postgresql+psycopg://bvphoenix:bvphoenix@localhost:5432/bvphoenix
      BVP_RUN_SEARCH_INTEGRATION: "1"
      HF_HOME: /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-${{ runner.os }}-search-eval-ai-v2
      - name: Migrate + run semantic relevance eval
        working-directory: backend
        run: |
          uv sync --extra dev --extra ai
          # FlagEmbedding (--no-deps, mirrors the Dockerfile) so the BGE-M3
          # sparse + ColBERT eval tests run here instead of self-skipping on
          # importorskip('FlagEmbedding'). Its real deps come from --extra ai.
          uv pip install --no-deps "FlagEmbedding==1.4.0"
          uv run alembic upgrade head
          uv run pytest tests/eval/test_semantic_relevance.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  docker-images:
    name: Build + push images
    # Native ARM64 runner. The reference production cluster is ARM64,
    # so the images are arm64-only; building natively
    # removes the QEMU x86→arm64 emulation step (5–10x slower than
    # native). Falls back to ``ubuntu-latest`` (amd64) only if a
    # multi-arch fan-out is ever needed — would have to re-add
    # ``docker/setup-qemu-action`` in that case.
    runs-on: ubuntu-24.04-arm
    needs: [backend-test, backend-db-test, search-eval, frontend-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      # Push credential for rg.fr-par.scw.cloud (IAM application
      # ``bvphoenix-registry-push``, ContainerRegistryFullAccess scoped
      # to project bitvision). Declared at job level so the mirror
      # step's ``if:`` can test for its presence — repos without the
      # secret (forks, pre-migration checkouts) skip the mirror and
      # still publish to GHCR.
      SCW_REGISTRY_SECRET_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
    strategy:
      # Don't cancel sibling builds on first failure: the four images
      # are independent (a registry-side permissions glitch on one of
      # them, or a Dockerfile change isolated to one service, must
      # not block the others from publishing). The deploy is then
      # done image-by-image so partial success is still useful.
      fail-fast: false
      matrix:
        service: [backend, workers, frontend, mcp-http, inference-svc]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Capture a stable RFC 3339 build timestamp once, so all four
      # service images of the same release line carry the same value.
      - id: buildmeta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Strip a leading "v" from the ref name so semver consumers
          # (image tag, /api/version) see "3.7.1" not "v3.7.1".
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/dockerfiles/${{ matrix.service }}.Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored as a sidecar ``:buildcache`` tag in the same
          # GHCR repo (per service). type=registry (not type=gha) because the
          # ML images are multi-GB and would blow GHA's 10GB repo-wide cache;
          # mode=max also caches the multi-stage *builder* layers, so an
          # unchanged-prefix build reuses the torch install + the baked HF
          # model layer instead of re-downloading ~2.8GB from HuggingFace
          # (the recurring 429 flake). A code change below the model-bake
          # layer still reuses everything above it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache,mode=max
          # Build identity baked into the image; surfaced by GET
          # /api/version and the /settings build-info card.
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}

      # Mirror the release image to the Scaleway Container Registry —
      # the production cluster pulls from rg.fr-par.scw.cloud/bvphoenix
      # (same cloud: the NAT'd pool egress to GHCR/Azure CDN times out
      # on multi-GB blobs, the recurring ImagePullBackOff at every
      # release). skopeo ships preinstalled on the GitHub runners; the
      # digest-level copy reuses the blobs just pushed to GHCR.
      - name: Mirror release image to Scaleway registry
        if: env.SCW_REGISTRY_SECRET_KEY != ''
        run: |
          ver="${{ steps.buildmeta.outputs.version }}"
          # The NAT'd Scaleway egress drops large blob uploads to the registry
          # in sustained windows (a 504 / "closed network connection" mid-PATCH
          # on the multi-hundred-MB layers of the backend/workers images — see
          # the registry-egress infra task). skopeo re-uploads a failed blob
          # from scratch and skips blobs already committed, so more retries ride
          # out a bad window. (NB: the runner's skopeo predates --retry-delay,
          # so only --retry-times is portable here.)
          skopeo copy --all --retry-times 12 \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "nologin:${SCW_REGISTRY_SECRET_KEY}" \
            "docker://ghcr.io/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${ver}" \
            "docker://rg.fr-par.scw.cloud/bvphoenix/${{ matrix.service }}:${ver}"
