  # ---- RIDER Lung CT — CC-BY-3.0 (targeted golden) --------------
  # Same-day repeat ("coffee-break" test-retest) thoracic CT with
  # radiologist tumour SEG — the reproducibility reference for the
  # longitudinal-comparison golden. Kept as a single explicit subject so
  # the golden's --only-series targeting (test/retest CT pair + GT SEG)
  # stays reproducible; switch to ``subjects: all`` for the full 32-subject
  # collection in a maximal bulk run.
  - collection: TCIA/RIDER Lung CT
    adapter: tcia
    license_spdx: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    citation_required: true
    citation_text: >-
      Zhao B, Schwartz LH, Kris MG. Data from RIDER_Lung CT. The Cancer
      Imaging Archive. doi:10.7937/K9/TCIA.2015.U1X8A5NR. Zhao B, James LP,
