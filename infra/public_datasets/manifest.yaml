# OpenData public dataset manifest (RADIOLOGY) — see ./README.md for schema.
#
# Licensing gate (the controlling risk):
#   ELIGIBLE  CC-BY-3.0 / CC-BY-4.0 / CC0-1.0      → commercial reuse OK
#   ELIGIBLE  CC-BY-NC-*                           → ingested but LABELLED
#             non-commercial / educational use only (commercial_use_allowed
#             is derived from the SPDX and excludes these from any
#             commercial tier). MIDRC-RICORD-1C/1A and NSCLC-Radiomics fall
#             here.
#   INELIGIBLE  *-ND, CC-BY-(NC-)SA (viral), NIH/TCIA Controlled Access,
#             Kaggle embargo. Brain/head collections are almost all
#             Controlled since the 2022 TCIA face-reconstruction policy;
#             UPENN-GBM (defaced) and ReMIND are the CC-BY exceptions.
#
# ``subjects: all`` enumerates every PatientID in the collection via NBIA
# getPatient (whole-collection ingest for the maximal wave). Re-runs are
# idempotent: already-complete series are skipped before download. The
# K8s Job defaults to PILOT (a 3-subject smoke set via --only); a bulk run
# clears PILOT to ingest the full ``subjects: all`` set.
#
# Citation integrity: every entry carries the verified SPDX + the canonical
# citation. New collections are STAGED at the bottom (commented) until their
# exact TCIA "Data Citation" string is pasted in — we do not fabricate DOIs
# for a medical dataset.

sources:
  # ---- Lung CT (LIDC-IDRI) — CC-BY-3.0 ---------------------------
  # 1010 thoracic CT scans with annotated lung nodules.
  - collection: TCIA/LIDC-IDRI
    adapter: tcia
    license_spdx: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    citation_required: true
    citation_text: >-
      Armato SG 3rd, McLennan G, et al. The Lung Image Database
      Consortium (LIDC) and Image Database Resource Initiative
      (IDRI): a completed reference database of lung nodules on CT
      scans. Med Phys. 2011 Feb;38(2):915-31. doi:10.1118/1.3528204
    subjects: all

