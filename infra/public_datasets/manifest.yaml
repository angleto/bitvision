# OpenData public dataset manifest (RADIOLOGY, NBIA v1) — see ./README.md.
#
# 109 ACTIVE collections (subjects: all), every license SPDX +
# canonical TCIA citation verified against the live collection page + DOI, and
# every collection confirmed present in the NBIA v1 getCollectionValues API on
# 2026-06-28. Two multi-agent classification waves swept the whole catalog.
#
# Licensing gate: CC-BY/CC0 = commercial OK; CC-BY-NC-* = ingested but LABELLED
# non-commercial (commercial_use_allowed derived from the SPDX). INELIGIBLE:
# *-ND/-SA, and NIH/TCIA Controlled Access — the pediatric NCTN trials
# (ACNS0332, AHEP0731, AHOD0831, ARAR0331, AREN053x, A091105, CALGB50303,
# S0819), ACRIN-HNSCC-FDG-PET-CT and mixed-license LDCT-and-Projection-data
# were rejected for this. CMB-* and CPTAC-LSCC drop their NIH-Controlled
# head/face series via exclude_body_parts.
#
# NBIA names are CASE-SENSITIVE and passed verbatim — note the SPACE (not
# hyphen) in "NSCLC Radiogenomics", "RIDER Lung CT", "CT COLONOGRAPHY",
# "QIN Breast DCE-MRI", "QIN LUNG CT".
#
# Non-patient data (phantoms, animal models) and pseudo-PHI teaching sets are
# documented at the bottom but NOT active — they are not real patient cases.
# NLST and four other website-only collections are handled separately (see the
# NOT ON NBIA v1 block and manifest-idc.yaml for NLST via IDC).
#
# Projection: ~47560 active studies (137/109
# commercially eligible). TODO: re-evaluate LCTSC (structured-output failure).

