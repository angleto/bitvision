# OpenData public dataset manifest (RADIOLOGY) — see ./README.md for schema.
#
# Licensing gate (the controlling risk):
#   ELIGIBLE  CC-BY-3.0 / CC-BY-4.0 / CC0-1.0  → commercial reuse OK
#   ELIGIBLE  CC-BY-NC-*                       → ingested but LABELLED
#             non-commercial / educational only (commercial_use_allowed is
#             derived from the SPDX and excludes these from any commercial
#             tier). MIDRC-RICORD-1C/1A, Duke-Breast-Cancer-MRI and
#             NSCLC-Radiomics fall here.
#   INELIGIBLE  *-ND, CC-BY-(NC-)SA (viral), NIH/TCIA Controlled Access.
#             Brain/head collections are almost all Controlled since the
#             2022 TCIA face-reconstruction policy (HNSCC, Head-Neck-PET-CT
#             were rejected for this); UPENN-GBM (defaced) and ReMIND are
#             the CC-BY exceptions, and CMB-LCA/CMB-CRC drop their head
#             series via exclude_body_parts.
#
# ``subjects: all`` enumerates every PatientID in the collection via NBIA
# getPatient (whole-collection ingest). Re-runs are idempotent: complete
# series are skipped before download. The K8s Job defaults to PILOT (a
# 3-subject smoke set via --only); the bulk Job (PILOT=0) ingests the full
# ``subjects: all`` set and is resumable, so a single bounded run grows the
# library incrementally.
#
# Citation integrity: every license SPDX + canonical TCIA citation below was
# verified against the live TCIA collection page + DOI on 2026-06-28. NBIA
# collection names are CASE-SENSITIVE and passed verbatim — note the SPACE
# (not hyphen) in "NSCLC Radiogenomics" and "RIDER Lung CT".
#
# Projection: the ACTIVE set below projects to well over 10,000 public
# studies; the four GATED giants + the pseudo-PHI teaching set at the bottom
# are intentionally NOT active (see their rationale).

sources:
