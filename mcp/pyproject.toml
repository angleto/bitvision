[project]
name = "bvmcp"
version = "0.0.1"
description = "bitvision phoenix — native MCP server for LLM/agent clients"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "bitvision phoenix contributors" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    # HTTP transport gates inbound bearer secrets via the backend's
    # /api/internal/agent-bearer/resolve RPC; no JWT/JWKS path remains.
    "starlette>=0.41.0",
    "uvicorn[standard]>=0.32.0",
    # Reuse the backend's slowapi-based rate limiter shape; pin the
    # same version range so behaviour is identical.
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvmcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
