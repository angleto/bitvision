[project]
name = "bvinference"
version = "0.0.1"
description = "bitvision phoenix — CPU ONNX BiomedCLIP inference microservice"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "bitvision phoenix contributors" }]
# Runtime deps kept deliberately lean: the service ships an exported
# ONNX graph and runs it on onnxruntime CPU. It does NOT pull torch /
# open_clip at runtime — those are only needed by the one-time export
# script (the ``export`` optional extra), run at build time.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
# Heavy deps used ONLY by scripts/export_onnx.py to materialise the
# .onnx graphs. Never installed in the runtime image layer.
export = [
    "torch>=2.2.0",
    # Pin to the 2.x line: export_onnx.py targets the open_clip 2.x model
    # API, and 3.x is an untested major here. BiomedCLIP (hf-hub) is fully
    # supported on 2.x (matches the workers' open-clip-torch).
    "open_clip_torch>=2.24.0,<3",
    # open_clip builds BiomedCLIP's HuggingFace (PubMedBERT) text tower via
    # transformers; without it create_model_and_transforms raises
    # "Please pip install transformers to use pre-trained HuggingFace models".
    "transformers>=4.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvinference"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
