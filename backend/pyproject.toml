[project]
name = "bvphoenix"
version = "0.0.1"
description = "bitvision phoenix — REST API backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "bitvision phoenix contributors" }]
dependencies = [
    # The MCP scope catalog (mcp/src/bvmcp/scopes.py) is the single
    # source of truth for granular agent permissions. Importing it
    # here keeps the /settings/ai-assistants UI grant catalog in lockstep
    # with the runtime gate; before this dependency the two catalogs
    # drifted (UI exposed 10 legacy keys, MCP enforced 24 canonical
    # ones), so "abilita tutti" produced tokens missing documents:write
    # and friends. The import is data-only (frozen dataclasses) — no
    # runtime side effects, no transport / starlette / mcp deps loaded.
    "bvmcp",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "authlib>=1.3.0",
    # PyJWT replaces python-jose (unmaintained, CVE-2022-29217 algorithm
    # confusion). The ``crypto`` extra pulls ``cryptography`` for RS256
    # / ES256 support; HS256 alone would not need it. Pinned to the
    # 2.10 line which exposes the strict ``options.require`` validator
    # we depend on in ``auth/tokens.py``.
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "arq>=0.26.0",
    # Jinja2 powers the outbound notification templates (sprint C3).
    # Already a transitive dep of FastAPI/Starlette but we declare it
    # explicitly so a future starlette upgrade that drops the transitive
    # import path doesn't silently break notification rendering.
    "jinja2>=3.1.0",
    "structlog>=24.4.0",
    "pydicom>=3.0.0",
    # Decoder plugins for compressed DICOM transfer syntaxes that the
    # bare pydicom install can't unpack: JPEG Baseline / Extended /
    # Lossless / Lossless-SV1 (the workhorses of clinical CT/MR DVDs),
    # JPEG 2000, JPEG-LS, and DICOM RLE. Without these every CD-burned
    # DICOM gets a 500 with "Unable to decompress … pixel data because
    # all plugins are missing dependencies" the moment the viewer
    # tries to read pixel data.
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.0",
    "pylibjpeg-rle>=2.0",
    # Whole-slide imaging readers (pathology). openslide-bin ships the
    # libopenslide native binary as a Python wheel (Linux x86_64 +
    # aarch64, macOS arm64 + x86_64), removing the apt/brew step for
    # both prod and local dev. openslide-python is the Python wrapper;
    # it auto-detects the bundled binary at import. Covers SVS / NDPI
    # / OME-TIFF / MRXS / SCN — the formats hospital pathology
    # scanners produce. pyvips still wraps system libvips42 (apt on
    # Linux, ``brew install vips`` on macOS) for fast pyramid
    # traversal + JPEG thumbnail generation.
    "openslide-bin>=4.0.0",
    "openslide-python>=1.4.0",
    "pyvips>=2.2.3",
    "click>=8.1.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.18",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "Pillow>=11.0.0",
    # Lightweight PDF rasterizer (BSD-3, no system poppler / qpdf
    # dependency). Used to generate first-page JPEG thumbnails for
    # patient documents stored as PDF, served by the grid view as
    # the card cover.
    "pypdfium2>=4.30.0",
    # Sprint 3: OCR pipeline (ADR 0007). pdfminer.six is pure Python and
    # extracts the text layer from PDFs; Tesseract via pytesseract is
    # the rasterised fallback for scans. The Tesseract binary is
    # installed via the worker Dockerfile (apt-get tesseract-ocr +
    # tesseract-ocr-ita), not via pip.
    "pdfminer.six>=20240706",
    "pytesseract>=0.3.10",
    "nibabel>=5.3.0",
    "slowapi>=0.1.9",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",
    "anthropic>=0.40.0",
    # OpenAI Python SDK — used by the OpenAI provider AND by the
    # Scaleway / Ollama adapters, both of which expose an
    # OpenAI-compatible Chat Completions endpoint and are configured
    # with a custom ``base_url``. The SDK is async-native and
    # streaming-ready, so the agentic loop and the SSE wrapper share
    # the same iterator shape across providers.
    "openai>=1.50.0",
    "highdicom>=0.27.0",
    # Server-side ISO 9660 / Joliet / Rock Ridge / UDF reader. Used as
    # the fallback when the client-side parser in
    # ``frontend/src/lib/iso9660.ts`` can't extract a hospital DVD
    # (UDF-only, hybrid, broken descriptor table). Lets the user drop
    # a raw ``.iso`` on the uploader and have the backend unpack it.
    "pycdlib>=1.14.0",
    # Three-way text merge engine. Pure-Python, no system deps. Used by
    # services/versioning to auto-resolve textual edit_edit conflicts
    # on clinical_note.body / report.text / summary.body when the two
    # branches modified non-overlapping regions; falls back to manual
    # resolution when ranges overlap.
    "merge3>=0.0.13",
    # Pure-Python streaming ZIP writer. Patient / folder / bulk export
    # builds the archive as an iterator of bytes that we relay straight
    # into S3 multipart upload, so memory stays at the part-size
    # ceiling regardless of how many GB of DICOM the patient has.
    # Replaces the legacy in-memory BytesIO path.
    "stream-zip>=0.0.78",
    # SVG -> PDF rasterizer. The care-timeline already renders an SVG via
    # care_phase_svg.render_svg; cairosvg converts it to PDF without a
    # second template. Native deps (libcairo2 + libpango) are installed
    # in the backend image; ~25 MB on disk vs ~70 MB for weasyprint.
    "cairosvg>=2.7.1",
]

[project.scripts]
bvphoenix-import = "bvphoenix.cli.import_dicom:main"
bvphoenix-import-pathology = "bvphoenix.cli.import_pathology:main"
bvphoenix-tile-pathology = "bvphoenix.cli.tile_pathology:main"
bvphoenix-gen-deid-fixtures = "bvphoenix.cli.gen_deid_fixtures:main"
bvphoenix-public-import = "bvphoenix.cli.public_import:main"
bvphoenix-public-import-pathology = "bvphoenix.cli.public_import_pathology:main"
bvphoenix-export = "bvphoenix.cli.export_dicom:main"
bvphoenix-admin = "bvphoenix.cli.admin:main"
bvphoenix-embed-models = "bvphoenix.cli.embed_models:cli"
bvphoenix-reembed = "bvphoenix.cli.reembed:main"
bvphoenix-purge-orphan-docs = "bvphoenix.cli.purge_orphan_docs:main"
bvphoenix-backfill = "bvphoenix.cli.backfill:main"

[project.optional-dependencies]
# Sentence embeddings for chunk_search vector retrieval. Heavy (torch CPU
# wheel + sentence-transformers + transformers + the BGE-M3 weights
# ≈ 2.5 GB on disk) so it's kept optional. Production backend image
# enables it via ``uv sync --extra ai`` so /api/patients/{id}/search/chunks
# returns semantic ranking (not FTS-only) and can encode the query with
# the active text model: MiniLM today, BGE-M3 (1024-d dense, loaded via
# sentence-transformers) after the registry flip. BGE-M3 sparse + ColBERT
# (Phase 2/3) will add FlagEmbedding then.
ai = [
    "sentence-transformers>=2.7.0",
    "torch>=2.5.0",
    # FlagEmbedding's real inference deps for BGE-M3 sparse + ColBERT query
    # encoding. FlagEmbedding itself is --no-deps in the Dockerfile (pinned)
    # to drop the import-dead ir-datasets (its zlib-state C ext is the only
    # gcc need). `datasets` is imported eagerly by BGEM3FlagModel so it stays;
    # it drags pyarrow+pandas (aarch64 wheels, no compiler).
    "datasets>=2.19.0",
    "peft>=0.7.0",
    "accelerate>=0.20.1",
    "sentencepiece>=0.2.0",
    "protobuf>=4.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvphoenix"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E402: lazy module-level imports placed after const blocks (intentional
#       in v3 to avoid heavy ORM imports on module load).
# F821: forward refs in TODO blocks documented for Phase 4 cleanup of
#       the legacy api/patients.py + api/patient_tree.py runtime stubs.
# RUF002/RUF003: ambiguous unicode in italian comments + docstrings
#       (em-dash, accented letters that look like ASCII to ruff).
# RUF012: mutable default values on test class attributes (acceptable
#       in pytest fixtures that are never mutated).
# Cosmetic / style warnings ignored to keep CI green during the
# v3 refactor; phase 5 will revisit one rule at a time:
#   E501       — long lines
#   E402       — lazy module-level imports (intentional in v3)
#   F401       — unused imports left as forward refs in TODO blocks
#   F821       — forward refs in TODO runtime-stub blocks
#   N801/N806  — class/var naming on the SQLAlchemy / Pydantic surface
#   N814/N818  — import alias naming + Error/Exception suffix
#   B904       — raise … from … (style)
#   B017       — assertRaises(Exception) (test style)
#   SIM10x     — control-flow simplification suggestions
#   RUF001/2/3 — ambiguous unicode in italian text
#   RUF012     — mutable defaults on pytest class fixtures
ignore = [
  "E501", "E402", "F401", "F821",
  "N801", "N806", "N814", "N818",
  "B904", "B017",
  "SIM102", "SIM105", "SIM108", "SIM117",
  "RUF001", "RUF002", "RUF003", "RUF012",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Form", "fastapi.File"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The async engine in db/session.py is module-level, so its connection
# pool binds to one event loop. Run all async fixtures + tests on a
# single session-scoped loop so a later test never finds the engine
# "attached to a different loop" (the long-standing integration-test
# flakiness that kept these suites opt-in).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
